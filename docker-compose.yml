services:
  freescout-app:
    image: my-custom-freescout:latest
    user: "www-data:www-data" # Passes your terminal environment variables
    container_name: freescout-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - freescout_data:/var/www/html/storage
    environment:
      ### Freescout variables in .env file
      - APP_URL=http://localhost:8080
      # - SESSION_SECURE_COOKIE=true
      # - APP_PROXY=
      # - APP_CUSTOM_MAIL_HEADERS="IsTransactional:True;X-Custom-Header:value"
      # - APP_UPDATE_FOLDER_COUNTERS_IN_BACKGROUND=true
      # - APP_TIMEZONE=Europe/London
      # - APP_TRUSTED_PROXIES=192.168.1.1,192.168.1.2,192.168.1.3
      # - APP_REMOTE_HOST_WHITE_LIST=""
      - DB_CONNECTION=mysql
      - DB_HOST=freescout-db
      - DB_PORT=3306
      - DB_DATABASE=freescout
      - DB_USERNAME=freescout
      - DB_PASSWORD=secret_password
      # - APP_KEY=
    depends_on:
      - freescout-db

  freescout-db:
    image: mariadb:13.0.2
    user: "mysql:mysql"      
    container_name: freescout-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: freescout
      MARIADB_USER: freescout
      MARIADB_PASSWORD: secret_password
      MARIADB_ROOT_PASSWORD: root_secret_password
    volumes:
      - freescout_db_data:/var/lib/mysql

    volumes:
  freescout_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/temp/build-my-own-custom-freescout/freescout_data
  freescout_db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/temp/build-my-own-custom-freescout/freescout_db_data
