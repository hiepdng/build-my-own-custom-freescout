version: '3.8'

services:
  freescout-app:
    image: my-custom-freescout:latest
    container_name: freescout-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./freescout_data:/var/www/html
    environment:
      - APP_URL=http://localhost:8080
      # - SESSION_SECURE_COOKIE=true
      # - APP_PROXY=
      # - APP_CUSTOM_MAIL_HEADERS="IsTransactional:True;X-Custom-Header:value"
      # - APP_UPDATE_FOLDER_COUNTERS_IN_BACKGROUND=true
      # - APP_TIMEZONE=Europe/London
      # - APP_TRUSTED_PROXIES=192.168.1.1,192.168.1.2,192.168.1.3
      # - APP_REMOTE_HOST_WHITE_LIST=""
      - DB_CONNECTION=mysql
      - DB_HOST=freescout-db
      - DB_PORT=3306
      - DB_DATABASE=freescout
      - DB_USERNAME=freescout
      - DB_PASSWORD=secret_password
      # - APP_KEY=
    depends_on:
      - freescout-db

  freescout-db:
    image: mariadb:10.6
    container_name: freescout-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: freescout
      MYSQL_USER: freescout_user
      MYSQL_PASSWORD: secret_password
      MYSQL_ROOT_PASSWORD: root_secret_password
    volumes:
      - ./freescout_db_data:/var/lib/mysql

volumes:
  freescout_data:
  freescout_db_data:
